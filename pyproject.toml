[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ros2-doctor"
version = "0.1.0"
description = "Friendly ROS 2 developer diagnostic CLI for workspaces, builds, deps, topics, nodes, and TF."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "ros2-doctor contributors" }]
keywords = ["ros2", "robotics", "colcon", "diagnostics", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "typer>=0.12.0",
  "rich>=13.7.0",
  "tomli>=2.0.1; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-mock>=3.12.0",
  "ruff>=0.4.0",
]

[project.scripts]
ros2-doctor = "ros2_doctor.cli.app:main"

[project.urls]
Homepage = "https://github.com/itsyashk/ros2-doctor"
Repository = "https://github.com/itsyashk/ros2-doctor"
Issues = "https://github.com/itsyashk/ros2-doctor/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/ros2_doctor"]

[tool.hatch.build.targets.wheel.force-include]
"src/ros2_doctor/diagnostics/data" = "ros2_doctor/diagnostics/data"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/ros2_doctor/scan/_scanner.py" = ["E501", "E741"]
